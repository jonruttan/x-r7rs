name: Release

# A v* tag publishes a release: the tarball and its sha256, which a consumer's
# bundle.pin.xon verifies. The suite runs first; a red tree publishes nothing.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to roll (dry run -- publishes nothing)'
        required: true

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # tools/bundle.sh archives FROM a tag

      - name: Check out the x-lang this bundle declares
        run: |
          declared=$(sed -n 's/^(requires-release "\(.*\)")$/\1/p' bundle.xon)
          echo "bundle.xon declares $declared"
          git clone --depth 1 --branch "$declared" \
            https://github.com/jonruttan/x-lang.git .x-lang

      # The lang this bundle is built on, at the version bundle.xon requires.
      # Without it no spec runs -- see ci.yml for why the sibling layout the
      # harness probes for is unavailable on a runner and R5RS_ROOT is used
      # instead.
      # Cloned rather than checked out, for the same reason the x-lang step
      # above is: the version comes FROM bundle.xon.  A literal ref here would
      # be a second copy of the fact on the one path where getting it wrong
      # publishes a bundle built against a dependency nobody declared.
      - name: Check out the lang this bundle requires
        run: |
          declared=$(sed -n 's/^(requires-bundle "r5rs" "\(.*\)")$/\1/p' bundle.xon)
          echo "bundle.xon requires r5rs $declared"
          git clone --depth 1 --branch "$declared" \
            https://github.com/jonruttan/x-r5rs.git .x-r5rs

      - name: Build the platform
        working-directory: .x-lang
        run: |
          make engine      # acquire the pinned engine
          make             # x-bin at the repo root -- `make engine` does not build it
          make boot        # the launcher-free amalgams the harness loads

      # The gate: the last point a bad bundle can be stopped before it gets a
      # digest and a URL.
      - name: Run the R7RS specs
        run: |
          X="$PWD/.x-lang/x.sh" R5RS_ROOT="$PWD/.x-r5rs" sh tests/spec-gate.sh

      - name: Roll the bundle
        id: roll
        run: |
          TAG="${{ github.event_name == 'push' && github.ref_name || inputs.tag }}"
          sh tools/bundle.sh "$TAG" dist | tee roll.out
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      # Put the pin in the release notes, next to the URL it belongs to.
      - name: Publish
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ steps.roll.outputs.tag }}"
          {
            echo '## Install'
            echo
            echo '```sh'
            echo "x --install-bundle https://github.com/jonruttan/x-r7rs/releases/download/$TAG/bundle.pin.xon"
            echo '```'
            echo
            echo '## Or pin it, for a project'
            echo
            echo 'Put this in the project'"'"'s `bundle.pin.xon`:'
            echo
            echo '```x'
            sed -n '/^  (name /,$p' roll.out | sed 's/^  //'
            echo '```'
          } > notes.md
          gh release create "$TAG" \
            --title "x-r7rs $TAG" \
            --notes-file notes.md \
            "dist/x-r7rs-$TAG.tar.gz" \
            "dist/x-r7rs-$TAG.tar.gz.sha256" \
            "dist/bundle.pin.xon"
